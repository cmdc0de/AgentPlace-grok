[package]
name = "viewer-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Optional browser Bevy scene (primitives only)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_ecs = { version = "0.19.1", default-features = false }
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_sprite",
    "bevy_window",
    "webgl2",
    "png",
] }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

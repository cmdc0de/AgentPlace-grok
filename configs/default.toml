# Default experiment config for Milestone 4 (board, rules, food-economy report).
# Must fit in signed 64-bit for TOML integer parsing.
master_seed = 3735928559

[simulation]
step_duration_secs = 1.0
max_ticks = 100000
pause_when_empty = false
log_level = "info"

[world]
seed = "auto"
width = 64
height = 64
max_height = 16

[world.terrain]
octaves = 4
persistence = 0.5
lacunarity = 2.0

[world.resources]
mineral_density = 1.0
vegetation_density = 1.0
water_coverage = 0.25
min_mineral_nodes = 10
min_fresh_water = 5
min_vegetation_patches = 20
animal_density = 1.0
fish_density = 1.0
min_animals = 8
min_fish = 8

[agents]
count = 16
spawn_mode = "scattered"
spawn_seed = "auto"
default_memory_capacity = 128
start_with_basic_needs = true

[agents.goals]
max_personal_goals = 5
max_public_goals = 3
can_adopt_public_goals = true

[agents.memory]
capacity = 128
eviction_policy = "importance_and_recency"
social_memory_bonus = 1.5
persistent_relationships = true
enable_embeddings = false
retrieval_k = 8

[agents.social]
base_influence_factor = 0.3
influence_decay = 0.01
track_relationships = true
trust_support_threshold = 20.0

[checkpoint]
auto_interval_ticks = 500
keep_last_n = 20
directory = "checkpoints"
write_markdown_summaries = true
write_retries = 3

# Overlay only — not part of ExperimentConfig / state_hash. Prefer CLI --listen.
[network]
tcp_listen = ""
ws_listen = ""
token = ""
allow_control = false

# Overlay only. Empty schedule = baseline (no incentives). See docs/incentive-schedule-format.md
[incentives]
schedule = ""

[observation]
base_vision_range = 12.0
base_hearing_range = 18.0
base_agent_identity_range = 8.0
full_information = false

# 0–100 display scale; stored as millipoints (×100). Decay every tick before agents act.
# Mock treats thirsty = thirst<50, hungry = hunger<50, tired = energy<max/3.
# Full write-up: docs/needs-and-survival.md
[needs]
hunger_max = 100.0
hunger_decay_per_tick = 0.15
thirst_max = 100.0
thirst_decay_per_tick = 0.25
energy_max = 100.0
energy_decay_per_tick = 0.08
energy_regen_while_resting = 0.4
death_enabled = true

[communication]
speech_is_free_action = true
base_speech_range = 18.0
shout_range_multiplier = 1.8
shout_energy_cost = 5.0
max_message_length = 200
allow_overhearing = true
warn_cooldown_ticks = 10

[llm]
provider = "mock"                              # CI default; empty provider also mocks
base_url = "http://spark-bcce.hlab:11434"      # used when --llm ollama (empty URL ⇒ mock)
api_key_env = "XAI_API_KEY"
model = "nemotron3:33b"                        # Spark default; ignored while provider=mock
action_temperature = 0.2
max_retries = 2
timeout_ms = 120000                            # 33B needs ~45s+ per call; 12s would Wait every tick
replay_file = ""

[proposals]
max_open_proposals_per_agent = 3
default_acceptance_threshold = 0.5
proposal_lifetime_ticks = 2000
max_proposal_length = 200
allow_meta_rules = false
public_board_always_visible = true

[metrics]
compute_every_n_ticks = 50
export_csv = true
track_consumption = true
track_proposal_stats = true
track_relationship_graph = true
# Overlay only (ignored by ExperimentConfig). Timing JSONL is on when --out-dir is set
# unless this is false.
# timing = true

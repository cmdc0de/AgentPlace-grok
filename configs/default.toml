# Default experiment config for Milestone 4 (board, rules, food-economy report).
# Must fit in signed 64-bit for TOML integer parsing.
master_seed = 3735928559

[simulation]
step_duration_secs = 1.0
max_ticks = 100000
pause_when_empty = false
log_level = "info"

[world]
seed = "auto"
width = 64
height = 64
max_height = 16

[world.terrain]
octaves = 4
persistence = 0.5
lacunarity = 2.0

[world.resources]
mineral_density = 1.0
vegetation_density = 1.0
water_coverage = 0.25
min_mineral_nodes = 10
min_fresh_water = 5
min_vegetation_patches = 20
animal_density = 1.0
fish_density = 1.0
min_animals = 8
min_fish = 8

[agents]
count = 16
spawn_mode = "scattered"
spawn_seed = "auto"
default_memory_capacity = 128
start_with_basic_needs = true

[agents.goals]
max_personal_goals = 5
max_public_goals = 3
can_adopt_public_goals = true

[checkpoint]
auto_interval_ticks = 500
keep_last_n = 20
directory = "checkpoints"
write_markdown_summaries = true
write_retries = 3

[observation]
base_vision_range = 12.0
base_hearing_range = 18.0
base_agent_identity_range = 8.0
full_information = false

[needs]
hunger_max = 100.0
hunger_decay_per_tick = 0.15
thirst_max = 100.0
thirst_decay_per_tick = 0.25
energy_max = 100.0
energy_decay_per_tick = 0.08
energy_regen_while_resting = 0.4
death_enabled = false

[communication]
speech_is_free_action = true
base_speech_range = 18.0
shout_range_multiplier = 1.8
shout_energy_cost = 5.0
max_message_length = 200
allow_overhearing = true
warn_cooldown_ticks = 10

[llm]
provider = "mock"
base_url = "http://localhost:11434"
api_key_env = "XAI_API_KEY"
model = ""
action_temperature = 0.2
max_retries = 2
timeout_ms = 12000
replay_file = ""

[proposals]
max_open_proposals_per_agent = 3
default_acceptance_threshold = 0.5
proposal_lifetime_ticks = 2000
max_proposal_length = 200
allow_meta_rules = false
public_board_always_visible = true

[metrics]
compute_every_n_ticks = 50
export_csv = true
track_consumption = true
track_proposal_stats = true

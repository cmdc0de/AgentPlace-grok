<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AgentPlace attach (postcard v5)</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; max-width: 96rem; }
    #log { white-space: pre-wrap; background: #111; color: #eee; padding: 1rem; min-height: 6rem; max-height: 12rem; overflow: auto; }
    label { display: inline-block; margin: 0.5rem 1rem 0.5rem 0; }
    table { border-collapse: collapse; margin: 0.5rem 0 1.25rem; width: 100%; font-size: 0.9rem; }
    th, td { border: 1px solid #ccc; padding: 0.25rem 0.4rem; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    h2 { margin-top: 1.25rem; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>AgentPlace browser attach</h1>
  <p>Postcard <code>PROTOCOL_VERSION = 5</code> over <code>ws://</code> (no TLS). Tables come from <code>Tick.metrics.inspector</code> JSON; Snapshot wasm is optional. <code>/set</code> <code>/give</code> <code>/ckpt</code> <code>/events</code> need <code>--allow-control</code>.</p>
  <label>WebSocket URL <input id="url" size="40" value="ws://127.0.0.1:9001" /></label>
  <label>Token (optional) <input id="token" size="20" /></label>
  <button id="connect">Connect</button>
  <button id="play" disabled>Play</button>
  <button id="pause" disabled>Pause</button>
  <div>
    <label>/give <input id="give-id" size="4" placeholder="id" /></label>
    <input id="give-item" size="12" placeholder="item" />
    <input id="give-qty" size="4" placeholder="qty" value="1" />
    <button id="give" disabled>Give</button>
    <label>/set <input id="set-id" size="4" placeholder="id" /></label>
    <input id="set-field" size="10" placeholder="hunger" />
    <input id="set-toward" size="6" placeholder="toward" />
    <input id="set-value" size="6" placeholder="0–100" />
    <button id="set" disabled>Set</button>
  </div>
  <div>
    <label>/scrub <input id="scrub-tick" size="8" placeholder="tick" /></label>
    <button id="scrub" disabled>Scrub</button>
    <button id="ckpt-prev" disabled>/ckpt prev</button>
    <button id="ckpt-next" disabled>/ckpt next</button>
    <label>/events <input id="events-tick" size="8" placeholder="tick" /></label>
    <button id="events" disabled>Events</button>
    <label>/inject</label>
    <textarea id="inject-toml" rows="4" cols="48" placeholder="[[incentives]]"></textarea>
    <button id="inject" disabled>Inject</button>
  </div>
  <div id="log"></div>
  <h2>Agents</h2>
  <p id="agents-empty" class="muted">Waiting for Tick (hit Play if the server started paused).</p>
  <div id="agents"></div>
  <h2>Board</h2>
  <div id="board"></div>
  <h2>Inventions</h2>
  <div id="inventions"></div>
  <h2>Metrics</h2>
  <div id="metrics"></div>
  <script>
    const PROTOCOL_VERSION = 5;
    function log(s) {
      const el = document.getElementById("log");
      el.textContent += s + "\n";
      el.scrollTop = el.scrollHeight;
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function varint(n) {
      const out = [];
      let x = n >>> 0;
      while (x >= 0x80) {
        out.push((x & 0x7f) | 0x80);
        x >>>= 7;
      }
      out.push(x);
      return out;
    }
    function frame(body) {
      const len = body.length;
      const out = new Uint8Array(4 + len);
      out[0] = len & 255;
      out[1] = (len >>> 8) & 255;
      out[2] = (len >>> 16) & 255;
      out[3] = (len >>> 24) & 255;
      out.set(body, 4);
      return out;
    }
    function encodeHello(token) {
      const body = [0];
      body.push(...varint(PROTOCOL_VERSION));
      if (token) {
        const enc = new TextEncoder().encode(token);
        body.push(1, ...varint(enc.length), ...enc);
      } else {
        body.push(0);
      }
      return frame(body);
    }
    function encodeSubscribe() {
      return frame([1, 1, 1]);
    }
    function encodeRequestSnapshot() {
      return frame([2]);
    }
    function encodeControl(play) {
      return frame([3, play ? 1 : 0]);
    }
    function encodeStr(s) {
      const enc = new TextEncoder().encode(s);
      return [...varint(enc.length), ...enc];
    }
    function encodeGive(id, item, qty) {
      return frame([3, 7, ...varint(id), ...encodeStr(item), ...varint(qty)]);
    }
    function encodeSet(id, field, toward, value) {
      const body = [3, 11, ...varint(id), ...encodeStr(field)];
      if (toward === null || toward === undefined || toward === "") {
        body.push(0);
      } else {
        body.push(1, ...varint(toward));
      }
      body.push(...varint(value));
      return frame(body);
    }
    function encodeScrub(tick) {
      return frame([3, 6, ...varint(tick)]);
    }
    function encodeCkptNext() {
      return frame([3, 8]);
    }
    function encodeCkptPrev() {
      return frame([3, 9]);
    }
    function encodeEvents(tick) {
      return frame([3, 10, ...varint(tick)]);
    }
    function encodeInject(toml) {
      return frame([4, ...encodeStr(toml)]);
    }
    function readVarint(u8, i) {
      let n = 0, shift = 0;
      while (i < u8.length) {
        const b = u8[i++];
        n |= (b & 0x7f) << shift;
        if ((b & 0x80) === 0) break;
        shift += 7;
      }
      return [n >>> 0, i];
    }
    function readVec(u8, i) {
      const [len, i2] = readVarint(u8, i);
      return [u8.subarray(i2, i2 + len), i2 + len];
    }
    function utf8(bytes) {
      return new TextDecoder().decode(bytes);
    }
    function parseJsonBytes(bytes) {
      if (!bytes || !bytes.length) return null;
      try { return JSON.parse(utf8(bytes)); } catch { return null; }
    }
    function decodeServer(raw) {
      if (raw.length < 4) return { type: "truncated" };
      const len = raw[0] | (raw[1] << 8) | (raw[2] << 16) | (raw[3] << 24);
      const p = raw.subarray(4, 4 + len);
      let i = 0;
      const [tag, i1] = readVarint(p, i);
      i = i1;
      if (tag === 0) {
        const [tick, i2] = readVarint(p, i);
        i = i2;
        const hash = Array.from(p.subarray(i, i + 32))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
        return { type: "Welcome", tick, hash: hash.slice(0, 16) + "…" };
      }
      if (tag === 1) {
        try {
          const [bytes] = readVec(p, i);
          return { type: "Snapshot", checkpoint: bytes };
        } catch (e) {
          return { type: "Snapshot" };
        }
      }
      if (tag === 2) {
        const [tick, i2] = readVarint(p, i);
        i = i2;
        const hash = Array.from(p.subarray(i, i + 32))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
        i += 32;
        let inspector = null;
        try {
          const ev = readVec(p, i); i = ev[1];
          const dec = readVec(p, i); i = dec[1];
          const met = readVec(p, i);
          const metrics = parseJsonBytes(met[0]);
          if (metrics && metrics.inspector) inspector = metrics.inspector;
        } catch (e) { /* keep M35 tick/hash if postcard layout mismatches */ }
        return { type: "Tick", tick, hash: hash.slice(0, 16) + "…", inspector };
      }
      if (tag === 3) return { type: "ReportReady" };
      if (tag === 4) return { type: "Error" };
      return { type: "msg", tag };
    }
    function mapText(obj) {
      if (!obj || typeof obj !== "object") return "";
      return Object.entries(obj).map(([k, v]) => k + "=" + v).join(" ");
    }
    function renderInspector(ins) {
      const empty = document.getElementById("agents-empty");
      if (!ins) return;
      empty.style.display = "none";
      const agents = ins.agents || [];
      let html = "<table><thead><tr><th>id</th><th>cell</th><th>hunger</th><th>thirst</th><th>energy</th><th>health</th><th>sheet</th><th>inventory</th><th>pack</th><th>goals</th><th>last</th><th>relationships</th><th>kinship</th></tr></thead><tbody>";
      for (const a of agents) {
        const rel = (a.relationships || []).map((r) =>
          "#" + r.id + " t" + r.trust + " a" + r.affinity + " r" + r.respect + " f" + r.fear
        ).join("; ");
        html += "<tr>" +
          "<td>" + esc(a.id) + "</td>" +
          "<td>" + esc(a.x) + "," + esc(a.y) + "</td>" +
          "<td>" + esc(a.hunger) + "</td>" +
          "<td>" + esc(a.thirst) + "</td>" +
          "<td>" + esc(a.energy) + "</td>" +
          "<td>" + esc(a.health) + "</td>" +
          "<td>" + esc(mapText(a.sheet)) + "</td>" +
          "<td>" + esc(mapText(a.inventory)) + "</td>" +
          "<td>" + esc(mapText(a.pack)) + "</td>" +
          "<td>" + esc((a.goals || []).join("; ")) + "</td>" +
          "<td>" + esc(a.last_action || "") + "</td>" +
          "<td>" + esc(rel) + "</td>" +
          "<td>" + esc((a.kinship || []).join("; ")) + "</td>" +
          "</tr>";
      }
      html += "</tbody></table>";
      document.getElementById("agents").innerHTML = html;

      const board = ins.board || {};
      const open = board.open || [];
      const adopted = board.adopted || [];
      let bhtml = "<h3>Open</h3><table><thead><tr><th>id</th><th>author</th><th>text</th><th>support</th><th>oppose</th></tr></thead><tbody>";
      for (const p of open) {
        bhtml += "<tr><td>" + esc(p.id) + "</td><td>" + esc(p.author) + "</td><td>" + esc(p.text) +
          "</td><td>" + esc(p.supporters) + "</td><td>" + esc(p.opposers) + "</td></tr>";
      }
      if (!open.length) bhtml += "<tr><td colspan=\"5\" class=\"muted\">none</td></tr>";
      bhtml += "</tbody></table><h3>Adopted</h3><table><thead><tr><th>proposal</th><th>text</th></tr></thead><tbody>";
      for (const r of adopted) {
        bhtml += "<tr><td>" + esc(r.proposal_id) + "</td><td>" + esc(r.text) + "</td></tr>";
      }
      if (!adopted.length) bhtml += "<tr><td colspan=\"2\" class=\"muted\">none</td></tr>";
      bhtml += "</tbody></table>";
      document.getElementById("board").innerHTML = bhtml;

      const m = ins.metrics || {};
      const t = m.timing || {};
      let mhtml = "<table><tbody>" +
        "<tr><th>hungry</th><td>" + esc(m.hungry) + "</td></tr>" +
        "<tr><th>thirsty</th><td>" + esc(m.thirsty) + "</td></tr>" +
        "<tr><th>tired</th><td>" + esc(m.tired) + "</td></tr>" +
        "<tr><th>mean trust</th><td>" + esc(m.mean_trust) + "</td></tr>" +
        "<tr><th>illness</th><td>" + esc(m.illness) + "</td></tr>" +
        "<tr><th>timing tick</th><td>" + esc(t.tick != null ? t.tick : "") + "</td></tr>" +
        "<tr><th>wall_ns</th><td>" + esc(t.wall_ns != null ? t.wall_ns : "") + "</td></tr>" +
        "<tr><th>world_ns</th><td>" + esc(t.world_ns != null ? t.world_ns : "") + "</td></tr>" +
        "<tr><th>board_ns</th><td>" + esc(t.board_ns != null ? t.board_ns : "") + "</td></tr>" +
        "<tr><th>incentive_ns</th><td>" + esc(t.incentive_ns != null ? t.incentive_ns : "") + "</td></tr>" +
        "<tr><th>agents_ns</th><td>" + esc(t.agents_ns != null ? t.agents_ns : "") + "</td></tr>" +
        "</tbody></table>";
      document.getElementById("metrics").innerHTML = mhtml;

      const invs = ins.inventions || [];
      let ihtml = "<table><thead><tr><th>id</th><th>inventor</th><th>kind</th><th>shared</th><th>tick</th></tr></thead><tbody>";
      for (const inv of invs) {
        ihtml += "<tr><td>" + esc(inv.id) + "</td><td>" + esc(inv.inventor) + "</td><td>" + esc(inv.kind) +
          "</td><td>" + esc(inv.shared) + "</td><td>" + esc(inv.tick) + "</td></tr>";
      }
      if (!invs.length) ihtml += "<tr><td colspan=\"5\" class=\"muted\">none</td></tr>";
      ihtml += "</tbody></table>";
      document.getElementById("inventions").innerHTML = ihtml;
    }
    async function inspectCheckpoint(bytes) {
      try {
        const m = await import("./pkg/sim_wasm.js");
        if (m && m.inspect_checkpoint) {
          const json = m.inspect_checkpoint(bytes);
          return typeof json === "string" ? JSON.parse(json) : json;
        }
      } catch (e) { /* wasm optional; Tick.metrics.inspector still works */ }
      return null;
    }
    let ws = null;
    document.getElementById("connect").onclick = () => {
      const url = document.getElementById("url").value.trim();
      const token = document.getElementById("token").value.trim();
      ws = new WebSocket(url);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        log("open " + url);
        ws.send(encodeHello(token || null));
        ws.send(encodeSubscribe());
        ws.send(encodeRequestSnapshot());
        document.getElementById("play").disabled = false;
        document.getElementById("pause").disabled = false;
        document.getElementById("give").disabled = false;
        document.getElementById("set").disabled = false;
        document.getElementById("scrub").disabled = false;
        document.getElementById("ckpt-prev").disabled = false;
        document.getElementById("ckpt-next").disabled = false;
        document.getElementById("events").disabled = false;
        document.getElementById("inject").disabled = false;
      };
      ws.onmessage = (ev) => {
        const u8 = new Uint8Array(ev.data);
        const msg = decodeServer(u8);
        if (msg.type === "Tick" || msg.type === "Welcome") {
          log(JSON.stringify({ type: msg.type, tick: msg.tick, hash: msg.hash }));
        } else {
          log(JSON.stringify({ type: msg.type, tag: msg.tag }));
        }
        if (msg.inspector) renderInspector(msg.inspector);
        if (msg.type === "Snapshot" && msg.checkpoint) {
          inspectCheckpoint(msg.checkpoint).then((ins) => {
            if (ins) renderInspector(ins);
          });
        }
      };
      ws.onerror = () => log("error");
      ws.onclose = () => log("close");
    };
    document.getElementById("play").onclick = () => {
      if (ws) ws.send(encodeControl(true));
    };
    document.getElementById("pause").onclick = () => {
      if (ws) ws.send(encodeControl(false));
    };
    document.getElementById("give").onclick = () => {
      if (!ws) return;
      const id = Number(document.getElementById("give-id").value);
      const item = document.getElementById("give-item").value.trim();
      const qty = Number(document.getElementById("give-qty").value) || 1;
      if (!item) return;
      ws.send(encodeGive(id, item, qty));
    };
    document.getElementById("set").onclick = () => {
      if (!ws) return;
      const id = Number(document.getElementById("set-id").value);
      const field = document.getElementById("set-field").value.trim();
      const towardRaw = document.getElementById("set-toward").value.trim();
      const value = Number(document.getElementById("set-value").value);
      if (!field) return;
      const toward = towardRaw === "" ? null : Number(towardRaw);
      ws.send(encodeSet(id, field, toward, value));
    };
    document.getElementById("scrub").onclick = () => {
      if (!ws) return;
      const tick = Number(document.getElementById("scrub-tick").value);
      if (!Number.isFinite(tick)) return;
      ws.send(encodeScrub(tick));
    };
    document.getElementById("ckpt-next").onclick = () => {
      if (ws) ws.send(encodeCkptNext());
    };
    document.getElementById("ckpt-prev").onclick = () => {
      if (ws) ws.send(encodeCkptPrev());
    };
    document.getElementById("events").onclick = () => {
      if (!ws) return;
      const tick = Number(document.getElementById("events-tick").value);
      if (!Number.isFinite(tick)) return;
      ws.send(encodeEvents(tick));
    };
    document.getElementById("inject").onclick = () => {
      if (!ws) return;
      const toml = document.getElementById("inject-toml").value;
      if (!toml.trim()) return;
      ws.send(encodeInject(toml));
    };
  </script>
</body>
</html>

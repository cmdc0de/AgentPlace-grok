<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AgentPlace attach (postcard v5)</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; max-width: 48rem; }
    #log { white-space: pre-wrap; background: #111; color: #eee; padding: 1rem; min-height: 8rem; }
    label { display: block; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <h1>AgentPlace browser attach</h1>
  <p>Postcard <code>PROTOCOL_VERSION = 5</code> over <code>ws://</code> (no TLS). Same Hello/Welcome/Tick as <code>sim-cli --connect</code>.</p>
  <label>WebSocket URL <input id="url" size="40" value="ws://127.0.0.1:9001" /></label>
  <label>Token (optional) <input id="token" size="20" /></label>
  <button id="connect">Connect</button>
  <button id="play" disabled>Play</button>
  <button id="pause" disabled>Pause</button>
  <div id="log"></div>
  <script>
    const PROTOCOL_VERSION = 5;
    function log(s) {
      const el = document.getElementById("log");
      el.textContent += s + "\n";
    }
    function varint(n) {
      const out = [];
      let x = n >>> 0;
      while (x >= 0x80) {
        out.push((x & 0x7f) | 0x80);
        x >>>= 7;
      }
      out.push(x);
      return out;
    }
    function encodeHello(token) {
      const body = [0];
      body.push(...varint(PROTOCOL_VERSION));
      if (token) {
        const enc = new TextEncoder().encode(token);
        body.push(1, ...varint(enc.length), ...enc);
      } else {
        body.push(0);
      }
      const len = body.length;
      const frame = new Uint8Array(4 + len);
      frame[0] = len & 255;
      frame[1] = (len >>> 8) & 255;
      frame[2] = (len >>> 16) & 255;
      frame[3] = (len >>> 24) & 255;
      frame.set(body, 4);
      return frame;
    }
    function encodeControl(play) {
      const body = [3, play ? 1 : 0];
      const len = body.length;
      const frame = new Uint8Array(4 + len);
      frame[0] = len & 255;
      frame.set(body, 4);
      return frame;
    }
    function readVarint(u8, i) {
      let n = 0, shift = 0;
      while (i < u8.length) {
        const b = u8[i++];
        n |= (b & 0x7f) << shift;
        if ((b & 0x80) === 0) break;
        shift += 7;
      }
      return [n >>> 0, i];
    }
    function decodeServer(frame) {
      if (frame.length < 4) return { type: "truncated" };
      const len = frame[0] | (frame[1] << 8) | (frame[2] << 16) | (frame[3] << 24);
      const p = frame.subarray(4, 4 + len);
      let i = 0;
      const [tag, i1] = readVarint(p, i);
      i = i1;
      if (tag === 0) {
        const [tick, i2] = readVarint(p, i);
        i = i2;
        const hash = Array.from(p.subarray(i, i + 32))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
        return { type: "Welcome", tick, hash: hash.slice(0, 16) + "…" };
      }
      if (tag === 2) {
        const [tick, i2] = readVarint(p, i);
        i = i2;
        const hash = Array.from(p.subarray(i, i + 32))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
        return { type: "Tick", tick, hash: hash.slice(0, 16) + "…" };
      }
      if (tag === 4) return { type: "Error" };
      return { type: "msg", tag };
    }
    let ws = null;
    document.getElementById("connect").onclick = () => {
      const url = document.getElementById("url").value.trim();
      const token = document.getElementById("token").value.trim();
      ws = new WebSocket(url);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        log("open " + url);
        ws.send(encodeHello(token || null));
        document.getElementById("play").disabled = false;
        document.getElementById("pause").disabled = false;
      };
      ws.onmessage = (ev) => {
        const u8 = new Uint8Array(ev.data);
        log(JSON.stringify(decodeServer(u8)));
      };
      ws.onerror = () => log("error");
      ws.onclose = () => log("close");
    };
    document.getElementById("play").onclick = () => {
      if (ws) ws.send(encodeControl(true));
    };
    document.getElementById("pause").onclick = () => {
      if (ws) ws.send(encodeControl(false));
    };
  </script>
</body>
</html>

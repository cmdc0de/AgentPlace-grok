[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-bevy",
    "crates/shared",
    "crates/sim-cli",
    "crates/viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-bevy = { path = "crates/sim-bevy" }
shared = { path = "crates/shared" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"
rand_chacha = "0.9"
twox-hash = "2"
sha2 = "0.10"
hex = "0.4"
bevy = "0.19.1"

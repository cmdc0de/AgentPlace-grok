[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-bevy",
    "crates/shared",
    "crates/sim-cli",
    "crates/viewer",
    "crates/sim-llm",
    "crates/sim-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-bevy = { path = "crates/sim-bevy" }
shared = { path = "crates/shared" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
twox-hash = "2"
sha2 = "0.10"
hex = "0.4"
bevy = { version = "0.19.1", features = ["jpeg"] }
postcard = { version = "1", features = ["use-std", "alloc"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sim-llm = { path = "crates/sim-llm" }
bevy_mod_imgui = "0.10"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
